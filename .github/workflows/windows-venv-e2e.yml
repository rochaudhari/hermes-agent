name: Windows venv-holder live E2E

# THROWAWAY (wine2e/relay-agent-loop only, never merged): validates the Relay agent-loop stream change on
# a standard windows-latest runner (the fork has no larger runners), replacing the venv-holder lanes.

on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-agent-loop:
    name: Relay agent-loop on Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Python and test dependencies
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Bench, 50 streams (unmanaged x1; private / agent_loop x3)
        shell: bash
        env:
          PY: ${{ steps.pm.outputs.python-path }}
        run: |
          set -uo pipefail
          nproc 2>/dev/null || echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          "$PY" -u evals/relay_stream_handoff/bench.py --ns 50 --chunks 200 --variants unmanaged --repeat 1 --timeout 1500
          "$PY" -u evals/relay_stream_handoff/bench.py --ns 50 --chunks 200 --variants private,agent_loop --repeat 3 --timeout 1500
