name: Windows venv-holder live E2E

# THROWAWAY (wine2e/relay-agent-loop only, never merged): validates the Relay agent-loop stream change on
# a standard windows-latest runner (the fork has no larger runners), replacing the venv-holder lanes.

on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-agent-loop:
    name: Relay agent-loop on Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Python and test dependencies
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Relay agent-loop and Relay stream tests
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/agent/test_relay_llm_agent_loop.py tests/agent/test_relay_llm.py -v

      - name: Bench smoke (unmanaged / private / agent_loop)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PY: ${{ steps.pm.outputs.python-path }}
        run: |
          set -uo pipefail
          "$PY" -c "import asyncio, sys; print(sys.version); print(type(asyncio.new_event_loop()).__name__)"
          "$PY" -u evals/relay_stream_handoff/bench.py --ns 1,10 --chunks 100
